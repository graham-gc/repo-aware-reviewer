name: Repo-aware PR review

'on':
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/review' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.311

      - uses: graham-gc/repo-aware-reviewer@main
        with:
          knowledge-path: ${{ vars.REVIEW_KNOWLEDGE_PATH }}
          knowledge-mode: ${{ vars.REVIEW_KNOWLEDGE_PATH != '' && 'scoped' || 'full' }}
          language: ${{ vars.REVIEW_LANGUAGE || 'en' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
