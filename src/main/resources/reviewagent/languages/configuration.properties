id=configuration
name=Structured configuration
source.extensions=xml,json,json5,yaml,yml,toml,ini,conf,properties,gitignore,gitattributes
source.names=.dockerignore,.env.example,.editorconfig,.npmrc,Procfile
manifests=.editorconfig,.dockerignore
review.hints=Interpret settings in their actual consumer and environment. Check defaults and overrides with consuming code. Configuration presence does not establish that a service loaded it or that a command ran.
index.enabled=false
